# TopStack auf dem Heimserver (ADR-0007). Start: docker compose --env-file .env up -d
name: topstack

services:
  caddy:
    # Caddy mit eingebautem App-Build (app/Dockerfile), Caddyfile von hier
    image: ghcr.io/${GITHUB_OWNER:-krauspeter}/topstack-web:${TOPSTACK_VERSION:-latest}
    build: ../app
    restart: unless-stopped
    ports: ["127.0.0.1:80:80"]  # nur lokal; von außen nur über den Cloudflare Tunnel
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api]

  api:
    image: ghcr.io/${GITHUB_OWNER:-krauspeter}/topstack-api:${TOPSTACK_VERSION:-latest}
    build: ../server
    restart: unless-stopped
    environment:
      TOPSTACK_ENVIRONMENT: ${TOPSTACK_ENVIRONMENT:-prod}
      TOPSTACK_DATABASE_URL: postgresql+asyncpg://topstack:${POSTGRES_PASSWORD}@db:5432/topstack
      TOPSTACK_MQTT_HOST: mqtt
      TOPSTACK_PUBLIC_ORIGIN: ${TOPSTACK_PUBLIC_ORIGIN}
      TOPSTACK_RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Web Push (AP-8); leer = Push aus
      TOPSTACK_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      TOPSTACK_VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      mqtt: { condition: service_started }

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: topstack
      POSTGRES_DB: topstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topstack"]
      interval: 10s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ["1883:1883"]      # nur im Heimnetz, nicht über den Tunnel
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto.passwd:/mosquitto/config/passwd:ro
      - mqtt-data:/mosquitto/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN fehlt in .env}
    depends_on: [caddy]

  # Backups (Phase 4, AP-1, ADR-0016). Läuft nur auf Abruf, nachts per systemd-Timer:
  #   docker compose --env-file .env --profile ops run --rm backup backup nightly
  backup:
    image: ghcr.io/${GITHUB_OWNER:-krauspeter}/topstack-backup:${TOPSTACK_VERSION:-latest}
    build: ./backup
    profiles: [ops]
    environment:
      PGHOST: db
      PGUSER: topstack
      PGDATABASE: topstack
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_UID: ${BACKUP_UID:-1000}
      BACKUP_GID: ${BACKUP_GID:-1000}
      BACKUP_OFFSITE: ${BACKUP_OFFSITE:-on}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      RESTORE_TEST_PING_URL: ${RESTORE_TEST_PING_URL:-}
      R2_BUCKET: ${R2_BUCKET:-topstack-backups}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    volumes:
      # außerhalb des Repos, enthält E-Mail-Adressen der Mitspieler
      # (ohne BACKUP_DIR verweigert infra/ops/backup.sh den Start; der Platzhalter hält nur `docker compose up` lauffähig)
      - ${BACKUP_DIR:-/tmp/topstack-backup-dir-fehlt}:/backups
    depends_on:
      db: { condition: service_healthy }

  # Ab Phase 4, AP-2: Uptime Kuma

volumes:
  caddy-data:
  db-data:
  mqtt-data:
