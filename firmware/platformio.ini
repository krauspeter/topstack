; TopStack Steuergerät (Phase 6). Logik in lib/ ist hardwareunabhängig und wird nativ getestet.
[platformio]
default_envs = esp32

[env]
test_framework = unity

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2
test_ignore = *

[env:native]
platform = native
build_flags = -std=c++17
