name: Screenshots

# Screenshots fürs README (Phase 4, AP-6) aus app/e2e/screenshots.spec.ts, mit erfundenen Daten.
# Läuft von selbst in PRs, die die Screenshot-Datei ändern, sonst von Hand: Actions → Screenshots →
# Run workflow → Branch wählen. Die Bilder werden als Commit „docs: update README screenshots“ auf
# denselben Branch gelegt (nie direkt auf main) und zusätzlich als Artefakt hochgeladen.
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/e2e/screenshots.spec.ts', '.github/workflows/screenshots.yml']

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: { image: 'mcr.microsoft.com/playwright:v1.65.1-noble' }  # wie der Job „app“ in ci.yml
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.head_ref || github.ref_name }}' }
      - name: Abhängigkeiten
        run: npm ci && npx playwright install chromium
      - name: Screenshots aufnehmen (Android, Pixel 7)
        run: SCREENSHOTS=1 npx playwright test screenshots --project=android
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: docs/img }
      - name: Auf den Branch legen
        if: (github.head_ref || github.ref_name) != 'main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        working-directory: .
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/img
          if git diff --cached --quiet; then echo "Screenshots unverändert"; exit 0; fi
          # [skip ci]: Commits des Bots brauchen sonst eine Freigabe, bevor CI läuft; geändert sind nur Bilder
          git commit -m "docs: update README screenshots [skip ci]" -m "Generated by the Screenshots workflow from app/e2e/screenshots.spec.ts."
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
