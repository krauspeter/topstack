name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
      firmware: ${{ steps.filter.outputs.firmware }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app: ['app/**', '.github/workflows/ci.yml']
            server: ['server/**', '.github/workflows/ci.yml']
            firmware: ['firmware/**', '.github/workflows/ci.yml']
            docs: ['docs/**', '.github/workflows/ci.yml']
            infra: ['infra/**', '.github/workflows/ci.yml']
      # Läuft bei jedem PR, weil es fast nichts kostet (AP-4)
      - name: Version einheitlich und Changelog passend
        run: bash scripts/check-version.sh
      - name: Skripte im Repo prüfen (shellcheck)
        run: shellcheck --severity=warning scripts/*.sh
      - name: Staging-Caddyfile gleich der Produktion bis auf den Beta-Block (AP-3b)
        run: diff <(sed '/# BETA-START/,/# BETA-END/d; 1d' infra/staging/Caddyfile) <(sed 1d infra/Caddyfile)
      - name: stage.sh erkennt vorhandene und fehlende Images (AP-3b)
        run: |
          owner=${{ github.repository_owner }}
          eval "$(sed -n '/^image_exists()/,/^}/p' scripts/stage.sh)"
          image_exists topstack-api 0.9.0 && echo "✓ 0.9.0 vorhanden"
          if image_exists topstack-api pr-0 2>/dev/null; then echo "✗ pr-0 dürfte es nicht geben"; exit 1; fi
          echo "✓ pr-0 fehlt"
      - name: Release-Skript in einer Wegwerf-Kopie
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          work=$(mktemp -d) && git clone -q . "$work" && cd "$work"
          check() { if eval "$2"; then echo "✓ $1"; else echo "✗ $1"; exit 1; fi; }
          check "ungültige Version abgelehnt" "! bash scripts/release.sh 1.0 --no-branch 2>/dev/null"
          check "kleinere Version abgelehnt" "! bash scripts/release.sh 0.0.1 --no-branch 2>/dev/null"
          cur=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' app/package.json | head -n1)
          next=$(printf '%s' "${cur%%-*}" | awk -F. '{print $1"."$2"."$3+1}')
          if awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -q '^- '; then
            check "Release $next vorbereitet" "bash scripts/release.sh $next --no-branch >/dev/null"
            check "Version überall $next" "bash scripts/check-version.sh | grep -q '✓ Version $next'"
            check "Changelog-Abschnitt $next" "grep -q '^## \[$next\] - ' CHANGELOG.md && grep -q '^## \[Unreleased\]' CHANGELOG.md"
            check "leerer Abschnitt Unreleased abgelehnt" "! bash scripts/release.sh $next-rc.9 --no-branch 2>/dev/null"
          else
            check "leerer Abschnitt Unreleased abgelehnt" "! bash scripts/release.sh $next --no-branch 2>/dev/null"
          fi

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright-Image mit allen Systembibliotheken für Chromium und WebKit: Die Installation
    # per apt („--with-deps“) blieb zweimal am Ubuntu-Spiegel hängen und blockierte die Images.
    # Bei einem Playwright-Update in package-lock.json die Version hier mitziehen.
    container: { image: 'mcr.microsoft.com/playwright:v1.65.1-noble' }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-End (iPhone und Android emuliert)
        timeout-minutes: 12
        # Browser passend zur installierten Playwright-Version, ohne apt (steckt im Image)
        run: npx playwright install chromium webkit && npm run test:e2e
      - uses: actions/upload-artifact@v4
        with: { name: app-dist, path: app/dist }

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: topstack_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Repository- und Migrationstests gegen echtes PostgreSQL (ADR-0014)
      TOPSTACK_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/topstack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=topstack --cov-report=term-missing

  schema:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Schema in Postgres 16 laden
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ref' -c 'CREATE DATABASE mig'
          psql -v ON_ERROR_STOP=1 -d ref -f docs/schema.sql
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Leere Datenbank mit Alembic migrieren
        working-directory: server
        run: pip install -e . && alembic upgrade head
        env: { TOPSTACK_DATABASE_URL: 'postgresql+asyncpg://postgres:ci@localhost:5432/mig' }
      - name: Migration und docs/schema.sql vergleichen
        run: |
          dump() {
            docker exec ${{ job.services.postgres.id }} \
              pg_dump -U postgres --schema-only --no-owner --no-privileges \
              --exclude-table=alembic_version "$1" | grep -vE '^\\(un)?restrict'
          }
          dump ref > ref.sql
          dump mig > mig.sql
          if ! diff -u ref.sql mig.sql; then
            echo "::error::docs/schema.sql weicht von den Migrationen ab (ADR-0014)"
            exit 1
          fi

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e esp32

  smoke:
    # Startet den Stack wie auf dem Heimserver (ohne Tunnel) und prüft App, API und
    # Migrationen beim Start (Phase 3, AP-2).
    needs: changes
    if: >-
      ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - name: Geheimnisse für den Test
        run: |
          printf 'POSTGRES_PASSWORD=ci\nTOPSTACK_PUBLIC_ORIGIN=http://localhost\nCF_TUNNEL_TOKEN=unused\n' > .env
          docker run --rm -v "$PWD":/work eclipse-mosquitto:2 \
            mosquitto_passwd -c -b /work/mosquitto.passwd topstack ci
          sudo chown 1883:1883 mosquitto.passwd
      - name: Stack bauen und starten
        run: docker compose --env-file .env up -d --build --wait --wait-timeout 180 caddy api db mqtt
      - name: API antwortet über Caddy
        run: curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
      - name: App wird ausgeliefert, auch für Unterseiten
        run: |
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS http://localhost/irgendeine/seite | grep -q '<div id="root">'
          curl -fsSI http://localhost/sw.js | grep -qi 'cache-control: no-cache'
          curl -fsS http://localhost/manifest.webmanifest | grep -q 'TopStack'
      - name: Migrationen beim Start eingespielt
        run: docker compose --env-file .env exec -T api alembic current | grep -q '(head)'
      - name: Skripte für den Betrieb prüfen (shellcheck)
        run: shellcheck --severity=warning backup/topstack-backup.sh ops/*.sh
      - name: Backup und Wiederherstellungstest (AP-1, ohne R2)
        run: |
          mkdir -p /tmp/topstack-backups
          printf 'BACKUP_DIR=/tmp/topstack-backups\nBACKUP_OFFSITE=off\nBACKUP_UID=%s\nBACKUP_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
          docker compose --env-file .env --profile ops build backup
          ops/backup.sh backup nightly
          ops/backup.sh backup manual
          ops/backup.sh restore-test
          ops/backup.sh list
          test "$(find /tmp/topstack-backups/daily -name '*.dump' | wc -l)" = 1
      - name: Health meldet eine fehlende Datenbank mit 503 (AP-2)
        run: |
          curl -fsS http://localhost/api/v1/health | grep -q '"database":{"status":"ok"'
          docker compose --env-file .env stop db
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://localhost/api/v1/health)
          echo "ohne Datenbank: $code"
          test "$code" = 503
          docker compose --env-file .env start db
          for i in $(seq 1 30); do curl -fsS http://localhost/api/v1/health >/dev/null && break; sleep 2; done
          curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
      - name: Automatisches Deployment mit Rollback (AP-3)
        env:
          DEPLOY_SKIP_GIT: "1"
          DEPLOY_SKIP_PULL: "1"
          DEPLOY_STATE_DIR: /tmp/deploy-state
          DEPLOY_HEALTH_TIMEOUT: "60"
        run: |
          api=ghcr.io/krauspeter/topstack-api:latest
          good=$(docker image inspect -f '{{.Id}}' "$api")
          running() { docker inspect -f '{{.Image}}' "$(docker compose --env-file .env ps -q api)"; }
          echo "== 1. nichts Neues"
          ops/deploy.sh | tee /tmp/d1
          grep -q "Keine Änderung" /tmp/d1
          # Das kaputte Image kommt dort ins Spiel, wo sonst der Pull läuft, wie auf dem Heimserver.
          # Einmal bauen und danach nur noch umbenennen: Jeder neue Build hätte mit containerd eine
          # neue ID und wäre für das Skript ein neuer Stand, auf dem Heimserver kommt dagegen immer
          # dasselbe Image aus ghcr.io.
          printf 'FROM busybox\nCMD ["sleep", "3600"]\n' | docker build -q -t topstack-test/broken -
          broken="docker tag topstack-test/broken $api"
          echo "== 2. kaputtes API-Image: Rollback"
          if DEPLOY_PULL_HOOK="$broken" ops/deploy.sh; then echo "Deployment hätte scheitern müssen"; exit 1; fi
          check() { if eval "$2"; then echo "  ✓ $1"; else echo "  ✗ $1"; return 1; fi; }
          echo "  läuft:    $(running)"
          echo "  erwartet: $good"
          echo "  Name:     $(docker image inspect -f '{{.Id}}' "$api")"
          check "API läuft wieder mit dem alten Image" '[ "$(running)" = "$good" ]'
          check "API antwortet" "curl -fsS http://localhost/api/v1/health | grep -q '\"status\":\"ok\"'"
          check "Backup vor dem Update vorhanden" "ls /tmp/topstack-backups/manual | grep -q pre-deploy"
          echo "== 3. derselbe kaputte Stand wird nicht noch einmal versucht"
          DEPLOY_PULL_HOOK="$broken" ops/deploy.sh | tee /tmp/d3
          check "übersprungen" 'grep -q "übersprungen" /tmp/d3'
          check "API läuft weiter mit dem alten Image" '[ "$(running)" = "$good" ]'
      - name: Staging-Stack neben der Produktion (AP-3b)
        run: |
          set -o pipefail  # sonst zählt bei „deploy.sh | tee“ nur tee
          check() { if eval "$2"; then echo "  ✓ $1"; else echo "  ✗ $1"; return 1; fi; }
          # Eigener Klon wie auf dem Heimserver (~/topstack-beta); gebaut wurde oben mit dem Tag latest
          beta=/tmp/topstack-beta
          git clone -q .. "$beta"
          printf 'TOPSTACK_STACK=staging\nTOPSTACK_VERSION=latest\nTOPSTACK_PUBLIC_ORIGIN=http://localhost:8081\nPOSTGRES_PASSWORD=ci-beta\nMAIL_ALLOWLIST=peter@example.com\n' > "$beta/infra/.env"
          docker network create topstack-edge 2>/dev/null || true
          cd "$beta/infra"
          docker compose -f docker-compose.staging.yml --env-file .env up -d --wait --wait-timeout 180
          check "Staging meldet environment staging" "curl -fsS http://localhost:8081/api/v1/health | grep -q '\"environment\":\"staging\"'"
          check "Manifest „TopStack Beta“" "curl -fsS http://localhost:8081/manifest.webmanifest | grep -q 'TopStack Beta'"
          check "Beta-Icon statt des normalen" "curl -fsS -o /tmp/beta.png http://localhost:8081/icon-512.png && ! cmp -s /tmp/beta.png $GITHUB_WORKSPACE/app/public/icon-512.png"
          check "keine Suchmaschinen" "curl -fsSI http://localhost:8081/ | grep -qi 'x-robots-tag: noindex'"
          # Stabile Updates (AP-14, ADR-0021, TC-165): App-Dateien kommen frisch, gehashte lange gespeichert
          check "sw.js wird immer neu geprüft" "curl -fsSI http://localhost:8081/sw.js | grep -qi 'cache-control: no-cache'"
          check "index.html wird immer neu geprüft" "curl -fsSI http://localhost:8081/ | grep -qi 'cache-control: no-cache'"
          asset=$(curl -fsS http://localhost:8081/ | grep -o '/assets/[^\"]*\.js' | head -n1)
          check "gehashte Dateien unveränderlich ($asset)" "curl -fsSI http://localhost:8081$asset | grep -qi 'immutable'"
          check "Produktion bleibt prod" "curl -fsS http://localhost/api/v1/health | grep -q '\"environment\":\"prod\"'"
          check "Produktion mit normalem Manifest" "! curl -fsS http://localhost/manifest.webmanifest | grep -q Beta"
          check "Tunnel-Netz erreicht beta-caddy" "docker run --rm --network topstack-edge curlimages/curl -fsS http://beta-caddy/api/v1/health | grep -q staging"
          check "im Tunnel-Netz kein zweiter Dienst caddy" "! docker run --rm --network topstack-edge busybox nslookup caddy >/dev/null 2>&1"
          echo "== deploy.sh auf Staging: nichts Neues, kein Backup"
          cd "$beta"
          DEPLOY_SKIP_GIT=1 DEPLOY_SKIP_PULL=1 DEPLOY_HEALTH_TIMEOUT=60 infra/ops/deploy.sh | tee /tmp/b1
          check "keine Änderung" 'grep -q "Keine Änderung (Kanal latest)" /tmp/b1'
          echo "== geschlossener Pull Request: Kanal springt auf main"
          sed -i 's/^TOPSTACK_VERSION=.*/TOPSTACK_VERSION=pr-141/' infra/.env
          DEPLOY_PR_STATE=closed DEPLOY_SKIP_GIT=1 DEPLOY_SKIP_PULL=1 infra/ops/deploy.sh | tee /tmp/b2 || true
          check "zurück auf main" "grep -q '^TOPSTACK_VERSION=main' infra/.env && grep -q 'zurück auf main' /tmp/b2"
          echo "== Produktion lehnt pr-Kanäle ab"
          prod_env=$GITHUB_WORKSPACE/infra/.env
          cp "$prod_env" /tmp/prod.env
          echo 'TOPSTACK_VERSION=pr-141' >> "$prod_env"
          if DEPLOY_SKIP_GIT=1 DEPLOY_SKIP_PULL=1 DEPLOY_STATE_DIR=/tmp/deploy-state "$GITHUB_WORKSPACE/infra/ops/deploy.sh" | tee /tmp/b3; then
            echo "  ✗ hätte abgelehnt werden müssen"; exit 1
          fi
          cp /tmp/prod.env "$prod_env"
          check "abgelehnt" 'grep -q "nur für Staging" /tmp/b3'
      - name: Logs bei Fehler
        if: failure()
        run: docker compose --env-file .env logs --no-color

  images:
    name: build ${{ matrix.image }}
    # Baut die Images topstack-api (server/) und topstack-web (Caddy + App, app/).
    # In Pull Requests nur bauen, auf main zusätzlich nach ghcr.io pushen (ADR-0007).
    needs: [changes, server, app, smoke]
    if: >-
      ${{ !failure() && !cancelled() && (github.ref == 'refs/heads/main' ||
      needs.changes.outputs.server == 'true' || needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.infra == 'true') }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: topstack-api, context: server }
          - { image: topstack-web, context: app }
          - { image: topstack-backup, context: infra/backup }
    env:
      MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      # Staging (AP-3b): PRs aus dem eigenen Repo bekommen ein Image pr-<Nummer> für scripts/stage.sh;
      # nicht für Forks und Dependabot (deren Token darf keine Pakete schreiben)
      PUSH: >-
        ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Herkunft des Builds (Anzeige „Update #… “ in der App)
        id: build
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Im PR die eigene Nummer; auf main aus der Commit-Nachricht des Merges
          # („Merge pull request #118 …“ oder beim Squash „… (#118)“)
          pr="$EVENT_PR"
          if [ -z "$pr" ]; then
            pr="$(printf '%s' "$MESSAGE" | head -n1 | grep -oE '#[0-9]+' | tail -n1 | tr -d '#' || true)"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Build für Update #${pr:-?} ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            BUILD_PR=${{ steps.build.outputs.pr }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
          # main = jeder Merge; latest und Versionsnummern setzt release.yml; pr-<Nummer> für Staging
          tags: >-
            ${{ env.MAIN == 'true'
            && format('ghcr.io/{0}/{1}:main,ghcr.io/{0}/{1}:{2}', github.repository_owner, matrix.image, github.sha)
            || format('ghcr.io/{0}/{1}:pr-{2}', github.repository_owner, matrix.image, github.event.pull_request.number) }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  images-result:
    # Pflicht-Check „images“ im Branch-Schutz von main: Die Matrix oben meldet sich je Image unter
    # eigenem Namen, übersprungen aber unter ihrem Grundnamen. Dieser Job heißt immer „images“ und
    # ist grün, wenn alle Images gebaut wurden oder der Bau zu Recht übersprungen wurde.
    name: images
    needs: images
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ergebnis der Image-Builds
        env:
          RESULT: ${{ needs.images.result }}
        run: |
          echo "Image-Builds: $RESULT"
          case "$RESULT" in
            success|skipped) exit 0 ;;
            *) echo "::error::Image-Builds nicht erfolgreich ($RESULT)"; exit 1 ;;
          esac
