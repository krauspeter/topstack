name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
      firmware: ${{ steps.filter.outputs.firmware }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app: ['app/**', '.github/workflows/ci.yml']
            server: ['server/**', '.github/workflows/ci.yml']
            firmware: ['firmware/**', '.github/workflows/ci.yml']
            docs: ['docs/**', '.github/workflows/ci.yml']
            infra: ['infra/**', '.github/workflows/ci.yml']

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright-Image mit allen Systembibliotheken für Chromium und WebKit: Die Installation
    # per apt („--with-deps“) blieb zweimal am Ubuntu-Spiegel hängen und blockierte die Images.
    # Bei einem Playwright-Update in package-lock.json die Version hier mitziehen.
    container: { image: 'mcr.microsoft.com/playwright:v1.65.1-noble' }
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - name: Abhängigkeiten
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-End (iPhone und Android emuliert)
        timeout-minutes: 12
        # Browser passend zur installierten Playwright-Version, ohne apt (steckt im Image)
        run: npx playwright install chromium webkit && npm run test:e2e
      - uses: actions/upload-artifact@v4
        with: { name: app-dist, path: app/dist }

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: topstack_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Repository- und Migrationstests gegen echtes PostgreSQL (ADR-0014)
      TOPSTACK_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci@localhost:5432/topstack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=topstack --cov-report=term-missing

  schema:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Schema in Postgres 16 laden
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ref' -c 'CREATE DATABASE mig'
          psql -v ON_ERROR_STOP=1 -d ref -f docs/schema.sql
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: ci }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - name: Leere Datenbank mit Alembic migrieren
        working-directory: server
        run: pip install -e . && alembic upgrade head
        env: { TOPSTACK_DATABASE_URL: 'postgresql+asyncpg://postgres:ci@localhost:5432/mig' }
      - name: Migration und docs/schema.sql vergleichen
        run: |
          dump() {
            docker exec ${{ job.services.postgres.id }} \
              pg_dump -U postgres --schema-only --no-owner --no-privileges \
              --exclude-table=alembic_version "$1" | grep -vE '^\\(un)?restrict'
          }
          dump ref > ref.sql
          dump mig > mig.sql
          if ! diff -u ref.sql mig.sql; then
            echo "::error::docs/schema.sql weicht von den Migrationen ab (ADR-0014)"
            exit 1
          fi

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio test -e native
      - run: pio run -e esp32

  smoke:
    # Startet den Stack wie auf dem Heimserver (ohne Tunnel) und prüft App, API und
    # Migrationen beim Start (Phase 3, AP-2).
    needs: changes
    if: >-
      ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v4
      - name: Geheimnisse für den Test
        run: |
          printf 'POSTGRES_PASSWORD=ci\nTOPSTACK_PUBLIC_ORIGIN=http://localhost\nCF_TUNNEL_TOKEN=unused\n' > .env
          docker run --rm -v "$PWD":/work eclipse-mosquitto:2 \
            mosquitto_passwd -c -b /work/mosquitto.passwd topstack ci
          sudo chown 1883:1883 mosquitto.passwd
      - name: Stack bauen und starten
        run: docker compose --env-file .env up -d --build --wait --wait-timeout 180 caddy api db mqtt
      - name: API antwortet über Caddy
        run: curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
      - name: App wird ausgeliefert, auch für Unterseiten
        run: |
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          curl -fsS http://localhost/irgendeine/seite | grep -q '<div id="root">'
          curl -fsSI http://localhost/sw.js | grep -qi 'cache-control: no-cache'
          curl -fsS http://localhost/manifest.webmanifest | grep -q 'TopStack'
      - name: Migrationen beim Start eingespielt
        run: docker compose --env-file .env exec -T api alembic current | grep -q '(head)'
      - name: Skripte für den Betrieb prüfen (shellcheck)
        run: shellcheck --severity=warning backup/topstack-backup.sh ops/*.sh
      - name: Backup und Wiederherstellungstest (AP-1, ohne R2)
        run: |
          mkdir -p /tmp/topstack-backups
          printf 'BACKUP_DIR=/tmp/topstack-backups\nBACKUP_OFFSITE=off\nBACKUP_UID=%s\nBACKUP_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
          docker compose --env-file .env --profile ops build backup
          ops/backup.sh backup nightly
          ops/backup.sh backup manual
          ops/backup.sh restore-test
          ops/backup.sh list
          test "$(find /tmp/topstack-backups/daily -name '*.dump' | wc -l)" = 1
      - name: Health meldet eine fehlende Datenbank mit 503 (AP-2)
        run: |
          curl -fsS http://localhost/api/v1/health | grep -q '"database":{"status":"ok"'
          docker compose --env-file .env stop db
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://localhost/api/v1/health)
          echo "ohne Datenbank: $code"
          test "$code" = 503
          docker compose --env-file .env start db
          for i in $(seq 1 30); do curl -fsS http://localhost/api/v1/health >/dev/null && break; sleep 2; done
          curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
      - name: Automatisches Deployment mit Rollback (AP-3)
        env:
          DEPLOY_SKIP_GIT: "1"
          DEPLOY_SKIP_PULL: "1"
          DEPLOY_STATE_DIR: /tmp/deploy-state
          DEPLOY_HEALTH_TIMEOUT: "60"
        run: |
          api=ghcr.io/krauspeter/topstack-api:latest
          good=$(docker image inspect -f '{{.Id}}' "$api")
          running() { docker inspect -f '{{.Image}}' "$(docker compose --env-file .env ps -q api)"; }
          echo "== 1. nichts Neues"
          ops/deploy.sh | tee /tmp/d1
          grep -q "Keine Änderung" /tmp/d1
          echo "== 2. kaputtes API-Image: Rollback"
          printf 'FROM busybox\nCMD ["sleep", "3600"]\n' | docker build -q -t "$api" -
          if ops/deploy.sh; then echo "Deployment hätte scheitern müssen"; exit 1; fi
          test "$(running)" = "$good"
          curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
          ls /tmp/topstack-backups/manual | grep -q pre-deploy
          echo "== 3. derselbe kaputte Stand wird nicht noch einmal versucht"
          printf 'FROM busybox\nCMD ["sleep", "3600"]\n' | docker build -q -t "$api" -
          ops/deploy.sh | tee /tmp/d3
          grep -q "übersprungen" /tmp/d3
          test "$(running)" = "$good"
      - name: Logs bei Fehler
        if: failure()
        run: docker compose --env-file .env logs --no-color

  images:
    # Baut die Images topstack-api (server/) und topstack-web (Caddy + App, app/).
    # In Pull Requests nur bauen, auf main zusätzlich nach ghcr.io pushen (ADR-0007).
    needs: [changes, server, app, smoke]
    if: >-
      ${{ !failure() && !cancelled() && (github.ref == 'refs/heads/main' ||
      needs.changes.outputs.server == 'true' || needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.infra == 'true') }}
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: topstack-api, context: server }
          - { image: topstack-web, context: app }
          - { image: topstack-backup, context: infra/backup }
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Herkunft des Builds (Anzeige „Update #… “ in der App)
        id: build
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Im PR die eigene Nummer; auf main aus der Commit-Nachricht des Merges
          # („Merge pull request #118 …“ oder beim Squash „… (#118)“)
          pr="$EVENT_PR"
          if [ -z "$pr" ]; then
            pr="$(printf '%s' "$MESSAGE" | head -n1 | grep -oE '#[0-9]+' | tail -n1 | tr -d '#' || true)"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Build für Update #${pr:-?} ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            BUILD_PR=${{ steps.build.outputs.pr }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
          # main = jeder Merge (Beta-Kanal); latest und Versionsnummern setzt release.yml beim Tag v*
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main,ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
