name: Release

# Ein Tag vX.Y.Z auf einem Commit in main macht dessen schon getestete Images zur Release-Version:
# ghcr.io/<owner>/<image>:<sha> bekommt zusätzlich X.Y.Z, X.Y und latest (ADR-0016, AP-3).
# Nichts wird neu gebaut. Den GitHub-Release mit dem Changelog ergänzt AP-4.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Images mit der Versionsnummer versehen
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          version=${GITHUB_REF_NAME#v}
          minor=${version%.*}
          for image in topstack-api topstack-web topstack-backup; do
            src="ghcr.io/$OWNER/$image:$GITHUB_SHA"
            # Kommt der Tag direkt nach dem Merge, baut die CI auf main die Images womöglich noch
            for _ in $(seq 1 30); do
              docker buildx imagetools inspect "$src" >/dev/null 2>&1 && break
              echo "warte auf $src"; sleep 20
            done
            docker buildx imagetools create \
              -t "ghcr.io/$OWNER/$image:$version" \
              -t "ghcr.io/$OWNER/$image:$minor" \
              -t "ghcr.io/$OWNER/$image:latest" \
              "$src"
            echo "$image: $version, $minor, latest ← ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          done
